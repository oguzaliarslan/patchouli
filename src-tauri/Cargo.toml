[package]
name = "tracker-app"
description = "Anime tracker desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "tracker_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde.workspace = true
serde_json.workspace = true

tracker-core.workspace = true
tracker-db.workspace = true
tracker-anitomy.workspace = true
tracker-detect.workspace = true
tracker-recognition.workspace = true
tracker-track.workspace = true
tracker-sync.workspace = true
tracker-share.workspace = true
tracker-compat.workspace = true
