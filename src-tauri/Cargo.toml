[package]
name = "tracker-app"
description = "Anime tracker desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "tracker_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
serde.workspace = true
tokio.workspace = true
keyring.workspace = true

# Add the other workspace crates here as the app starts using them.
tracker-core.workspace = true
tracker-db.workspace = true
tracker-settings.workspace = true
tracker-sync.workspace = true
tracker-anitomy.workspace = true
tracker-recognition.workspace = true
tracker-detect.workspace = true
tracker-track.workspace = true
