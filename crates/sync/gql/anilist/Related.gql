query ($ids: [Int]) {
  Page(perPage: 50) {
    media(id_in: $ids, type: ANIME) {
      id
      relations {
        edges {
          relationType
          node {
            type
            ...MediaFragment
          }
        }
      }
      recommendations(sort: RATING_DESC, perPage: 8) {
        nodes {
          rating
          mediaRecommendation {
            ...MediaFragment
          }
        }
      }
    }
  }
}
