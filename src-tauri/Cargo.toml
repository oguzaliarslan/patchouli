[package]
name = "patchouli"
description = "Anime tracker desktop app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "patchouli_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-window-state = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
tauri-plugin-updater = "2"
log.workspace = true
tempfile = "3"
chrono.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
keyring.workspace = true

# Add the other workspace crates here as the app starts using them.
patchouli-core.workspace = true
patchouli-db.workspace = true
patchouli-settings.workspace = true
patchouli-sync.workspace = true
patchouli-anitomy.workspace = true
patchouli-recognition.workspace = true
patchouli-detect.workspace = true
patchouli-track.workspace = true
patchouli-share.workspace = true
patchouli-compat.workspace = true
patchouli-feed.workspace = true
